<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Renewable Energy Prediction</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1>Renewable Energy Forecasting</h1>
      <p>Predict solar or wind power generation based on weather conditions.</p>
    </header>

    <main class="container">
      <!-- Left card: Input form -->
      <section class="card">
        <div class="card-content">
          <h2>Input Weather Data</h2>
          <form id="predict-form">
            <div class="field">
              <label for="temperature">Temperature (°C)</label>
              <input
                type="number"
                step="0.1"
                id="temperature"
                required
                placeholder="e.g. 28.5"
              />
            </div>

            <div class="field">
              <label for="wind_speed">Wind Speed (m/s)</label>
              <input
                type="number"
                step="0.1"
                id="wind_speed"
                required
                placeholder="e.g. 4.2"
              />
            </div>

            <div class="field">
              <label for="humidity">Humidity (%)</label>
              <input
                type="number"
                step="0.1"
                id="humidity"
                required
                placeholder="e.g. 60"
              />
            </div>

            <div class="field">
              <label for="solar_irradiance">Solar Irradiance (W/m²)</label>
              <input
                type="number"
                step="0.1"
                id="solar_irradiance"
                required
                placeholder="e.g. 750"
              />
            </div>

            <button type="submit" class="predict-btn">Predict Output</button>
          </form>
        </div>
      </section>

      <!-- Right card: Prediction + Graph in SAME card -->
      <section class="card result-card">
        <div class="card-content">
          <h2>Prediction Result</h2>

          <!-- Text output -->
          <p id="prediction-value">Enter data and click Predict.</p>

          <!-- Graph section inside same card -->
          <h3 style="margin-top: 1.4rem;">Prediction Trend</h3>
          <canvas
            id="predictionChart"
            width="400"
            height="220"
            style="margin-top: 0.75rem;"
          ></canvas>
        </div>
      </section>
    </main>

    <!-- Scripts: Chart.js first, then custom JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
  </body>
</html>
